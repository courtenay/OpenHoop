; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Arduino Nano 33 BLE Sense Rev2 (original design)
[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
lib_deps =
        adafruit/Adafruit DotStar@^1.1.5
        arduino-libraries/ArduinoBLE@^1.3.6
        arduino-libraries/Arduino_BMI270_BMM150@^1.1.1

; Seeed Studio XIAO BLE Sense (simplified design)
[env:xiao_ble_sense]
platform = nordicnrf52
board = seeed_xiao_nrf52840_sense
framework = arduino
lib_deps =
        adafruit/Adafruit DotStar@^1.1.5
        arduino-libraries/ArduinoBLE@^1.3.6
        seeed-studio/Seeed Arduino LSM6DS3@^2.0.3
