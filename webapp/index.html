<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHoop Controller</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            margin-right: 8px;
            display: inline-block;
        }

        .status-dot.connected {
            background: #2ed573;
        }

        .battery {
            font-size: 0.9em;
            opacity: 0.8;
        }

        #connectBtn {
            width: 100%;
            padding: 16px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s, opacity 0.2s;
        }

        #connectBtn:hover {
            transform: scale(1.02);
        }

        #connectBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section h2 {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            margin-bottom: 12px;
        }

        .effects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .effect-btn {
            padding: 14px 12px;
            border: 2px solid transparent;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .effect-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .effect-btn.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.3);
        }

        .effect-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .color-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #colorPicker {
            width: 60px;
            height: 50px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: none;
        }

        #colorPicker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        #colorPicker::-webkit-color-swatch {
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        #applyColorBtn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.2s;
        }

        #applyColorBtn:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
        }

        #applyColorBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.2);
            appearance: none;
            outline: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .slider-value {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
        }

        .presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .preset-btn {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .preset-btn:hover {
            transform: scale(1.1);
        }

        .preset-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .log {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.8em;
            max-height: 120px;
            overflow-y: auto;
            opacity: 0.7;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .log-entry.success {
            color: #51cf66;
        }

        #imuViz {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
        }

        .imu-data {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
            font-family: monospace;
            font-size: 0.85em;
        }

        .imu-data div {
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
        }

        .imu-label {
            opacity: 0.6;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OpenHoop</h1>

        <div class="status-bar">
            <div>
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
            <div class="battery" id="battery">--</div>
        </div>

        <button id="connectBtn">Connect to Hoop</button>

        <div class="section">
            <h2>IMU Visualization</h2>
            <div id="imuViz"></div>
            <div class="imu-data">
                <div><span class="imu-label">Accel X:</span> <span id="ax">--</span></div>
                <div><span class="imu-label">Accel Y:</span> <span id="ay">--</span></div>
                <div><span class="imu-label">Accel Z:</span> <span id="az">--</span></div>
                <div><span class="imu-label">Tilt:</span> <span id="tilt">--</span></div>
                <div><span class="imu-label">Gyro X:</span> <span id="gx">--</span></div>
                <div><span class="imu-label">Gyro Y:</span> <span id="gy">--</span></div>
                <div><span class="imu-label">Gyro Z:</span> <span id="gz">--</span></div>
                <div><span class="imu-label">Spin:</span> <span id="spin">--</span></div>
            </div>
        </div>

        <div class="section">
            <h2>Effects</h2>
            <div class="effects-grid">
                <button class="effect-btn" data-effect="0" disabled>Off</button>
                <button class="effect-btn" data-effect="1" disabled>Rainbow</button>
                <button class="effect-btn" data-effect="2" disabled>Colorwave</button>
                <button class="effect-btn" data-effect="3" disabled>Funky</button>
                <button class="effect-btn" data-effect="4" disabled>Rasta Flag</button>
                <button class="effect-btn" data-effect="5" disabled>Fire</button>
                <button class="effect-btn" data-effect="6" disabled>Leopard</button>
                <button class="effect-btn" data-effect="7" disabled>Mushroom</button>
                <button class="effect-btn" data-effect="95" disabled>Water</button>
                <button class="effect-btn" data-effect="96" disabled>Calibrate</button>
                <button class="effect-btn" data-effect="97" disabled>POV</button>
                <button class="effect-btn" data-effect="98" disabled>Pulse</button>
                <button class="effect-btn" data-effect="99" disabled>Spectrum</button>
            </div>
        </div>

        <div class="section">
            <h2>Solid Color</h2>
            <div class="color-row">
                <input type="color" id="colorPicker" value="#ff0080">
                <button id="applyColorBtn" disabled>Apply Color</button>
            </div>
            <div class="presets">
                <button class="preset-btn" style="background: #ff0000" data-color="FF0000" disabled></button>
                <button class="preset-btn" style="background: #ff8000" data-color="FF8000" disabled></button>
                <button class="preset-btn" style="background: #ffff00" data-color="FFFF00" disabled></button>
                <button class="preset-btn" style="background: #00ff00" data-color="00FF00" disabled></button>
                <button class="preset-btn" style="background: #00ffff" data-color="00FFFF" disabled></button>
                <button class="preset-btn" style="background: #0080ff" data-color="0080FF" disabled></button>
                <button class="preset-btn" style="background: #8000ff" data-color="8000FF" disabled></button>
                <button class="preset-btn" style="background: #ff00ff" data-color="FF00FF" disabled></button>
                <button class="preset-btn" style="background: #ffffff" data-color="FFFFFF" disabled></button>
            </div>
        </div>

        <div class="section">
            <h2>Brightness (Energy Saving)</h2>
            <div class="slider-container">
                <span>Bright</span>
                <input type="range" id="energySlider" min="0" max="8" value="0" disabled>
                <span>Dim</span>
                <span class="slider-value" id="energyValue">0</span>
            </div>
        </div>

        <div class="section">
            <h2>Log</h2>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        // BLE UUIDs - OpenHoop uses 16-bit UUIDs
        const SERVICE_UUID = 0x1815; // Automation IO Service
        const EFFECT_UUID = 0x0A92;
        const COLOR_UUID = 0x0A93;
        const IMU_UUID = 0x0A94;
        const ENERGY_UUID = 0x0A95;
        const BATTERY_SERVICE = 0x180F;
        const BATTERY_LEVEL_UUID = 0x2A19;

        // State
        let device = null;
        let server = null;
        let effectChar = null;
        let colorChar = null;
        let energyChar = null;
        let imuChar = null;
        let batteryChar = null;
        let currentEffect = null;

        // Three.js scene
        let scene, camera, renderer, hoopMesh, arduinoMarker;
        let targetRotation = { x: 0, y: 0, z: 0 };
        let currentRotation = { x: 0, y: 0, z: 0 };

        // DOM elements
        const connectBtn = document.getElementById('connectBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const batteryEl = document.getElementById('battery');
        const effectBtns = document.querySelectorAll('.effect-btn');
        const colorPicker = document.getElementById('colorPicker');
        const applyColorBtn = document.getElementById('applyColorBtn');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const energySlider = document.getElementById('energySlider');
        const energyValue = document.getElementById('energyValue');
        const logEl = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Initialize Three.js scene
        function initThreeJS() {
            const container = document.getElementById('imuViz');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            // Camera
            camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            camera.position.set(0, 2, 3);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            // Hoop (torus)
            const torusGeometry = new THREE.TorusGeometry(1, 0.03, 16, 100);
            const torusMaterial = new THREE.MeshPhongMaterial({
                color: 0x667eea,
                emissive: 0x334477,
                shininess: 100
            });
            hoopMesh = new THREE.Mesh(torusGeometry, torusMaterial);
            scene.add(hoopMesh);

            // Arduino marker (small box on the hoop)
            const markerGeometry = new THREE.BoxGeometry(0.15, 0.08, 0.05);
            const markerMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            arduinoMarker = new THREE.Mesh(markerGeometry, markerMaterial);
            arduinoMarker.position.set(1, 0, 0);
            hoopMesh.add(arduinoMarker);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 2, 1);
            scene.add(directionalLight);

            // Ground plane (shows "down" direction)
            const groundGeometry = new THREE.PlaneGeometry(4, 4);
            const groundMaterial = new THREE.MeshPhongMaterial({
                color: 0x333355,
                transparent: true,
                opacity: 0.3
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1.5;
            scene.add(ground);

            // Axis helper
            const axesHelper = new THREE.AxesHelper(0.5);
            axesHelper.position.set(-1.5, -1, -1.5);
            scene.add(axesHelper);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth interpolation to target rotation
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;
            currentRotation.z += (targetRotation.z - currentRotation.z) * 0.1;

            hoopMesh.rotation.x = currentRotation.x;
            hoopMesh.rotation.y = currentRotation.y;
            hoopMesh.rotation.z = currentRotation.z;

            renderer.render(scene, camera);
        }

        function onIMUData(event) {
            const data = new DataView(event.target.value.buffer);

            // Unpack 6 x int16 values
            const ax = data.getInt16(0, true) / 1000.0;  // Back to g
            const ay = data.getInt16(2, true) / 1000.0;
            const az = data.getInt16(4, true) / 1000.0;
            const gx = data.getInt16(6, true) / 10.0;    // Back to deg/s
            const gy = data.getInt16(8, true) / 10.0;
            const gz = data.getInt16(10, true) / 10.0;

            // Update display
            document.getElementById('ax').textContent = ax.toFixed(2) + 'g';
            document.getElementById('ay').textContent = ay.toFixed(2) + 'g';
            document.getElementById('az').textContent = az.toFixed(2) + 'g';
            document.getElementById('gx').textContent = gx.toFixed(1) + '°/s';
            document.getElementById('gy').textContent = gy.toFixed(1) + '°/s';
            document.getElementById('gz').textContent = gz.toFixed(1) + '°/s';

            // Calculate tilt angle from gravity
            const tilt = Math.atan2(Math.sqrt(ax*ax + az*az), ay) * 180 / Math.PI;
            const spin = Math.sqrt(gx*gx + gy*gy + gz*gz);
            document.getElementById('tilt').textContent = tilt.toFixed(1) + '°';
            document.getElementById('spin').textContent = spin.toFixed(1) + '°/s';

            // Calculate orientation from accelerometer only (no drift!)
            // Accelerometer measures gravity - gives us pitch and roll
            // Yaw (spin around vertical) cannot be determined from accelerometer alone
            const pitch = Math.atan2(-az, Math.sqrt(ax*ax + ay*ay));
            const roll = Math.atan2(ax, ay);

            targetRotation.x = pitch;
            targetRotation.z = roll;
            // Note: targetRotation.y (yaw) stays at 0 - can't determine from accel
            // Gyro could track it short-term but will drift, so we skip it
        }

        // Initialize Three.js on page load
        initThreeJS();

        function setConnected(connected) {
            statusDot.classList.toggle('connected', connected);
            statusText.textContent = connected ? 'Connected' : 'Disconnected';
            connectBtn.textContent = connected ? 'Disconnect' : 'Connect to Hoop';

            // Enable/disable controls
            effectBtns.forEach(btn => btn.disabled = !connected);
            applyColorBtn.disabled = !connected;
            presetBtns.forEach(btn => btn.disabled = !connected);
            energySlider.disabled = !connected;
        }

        async function connect() {
            try {
                log('Scanning for OpenHoop...');

                device = await navigator.bluetooth.requestDevice({
                    filters: [
                        { name: 'OpenHoop' },
                        { name: 'HulaHoopBLE' }
                    ],
                    optionalServices: [SERVICE_UUID, BATTERY_SERVICE]
                });

                device.addEventListener('gattserverdisconnected', onDisconnected);

                log('Connecting to GATT server...');
                server = await device.gatt.connect();

                // Get main service and characteristics
                log('Getting services...');
                const service = await server.getPrimaryService(SERVICE_UUID);

                effectChar = await service.getCharacteristic(EFFECT_UUID);
                colorChar = await service.getCharacteristic(COLOR_UUID);
                energyChar = await service.getCharacteristic(ENERGY_UUID);

                // Get IMU characteristic and subscribe to notifications
                try {
                    imuChar = await service.getCharacteristic(IMU_UUID);
                    await imuChar.startNotifications();
                    imuChar.addEventListener('characteristicvaluechanged', onIMUData);
                    log('IMU streaming enabled', 'success');
                } catch (e) {
                    log('IMU characteristic not available', 'error');
                }

                // Try to get battery service
                try {
                    const batteryService = await server.getPrimaryService(BATTERY_SERVICE);
                    batteryChar = await batteryService.getCharacteristic(BATTERY_LEVEL_UUID);
                    await batteryChar.startNotifications();
                    batteryChar.addEventListener('characteristicvaluechanged', onBatteryChanged);
                    // Read initial battery level
                    const batteryValue = await batteryChar.readValue();
                    batteryEl.textContent = `${batteryValue.getUint8(0)}%`;
                } catch (e) {
                    log('Battery service not available', 'error');
                }

                setConnected(true);
                log('Connected!', 'success');

            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        function disconnect() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
            }
        }

        function onDisconnected() {
            log('Disconnected');
            setConnected(false);
            effectChar = null;
            colorChar = null;
            energyChar = null;
            imuChar = null;
            batteryChar = null;
            currentEffect = null;
            effectBtns.forEach(btn => btn.classList.remove('active'));
        }

        function onBatteryChanged(event) {
            const value = event.target.value.getUint8(0);
            batteryEl.textContent = `${value}%`;
        }

        async function setEffect(effectId) {
            if (!effectChar) return;

            try {
                const data = new Uint8Array([effectId]);
                await effectChar.writeValue(data);

                currentEffect = effectId;
                effectBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.effect) === effectId);
                });

                // Reset visualization when calibrating
                if (effectId === 96) {
                    targetRotation = { x: 0, y: 0, z: 0 };
                    currentRotation = { x: 0, y: 0, z: 0 };
                    log('Calibration started - visualization reset to flat', 'success');
                }

                log(`Effect set to ${effectId}`, 'success');
            } catch (error) {
                log(`Failed to set effect: ${error.message}`, 'error');
            }
        }

        async function setColor(hexColor) {
            if (!colorChar) return;

            try {
                // Send as string (6 characters, no #)
                const encoder = new TextEncoder();
                const data = encoder.encode(hexColor);
                await colorChar.writeValue(data);

                // Clear effect selection since we're using solid color
                currentEffect = null;
                effectBtns.forEach(btn => btn.classList.remove('active'));

                log(`Color set to #${hexColor}`, 'success');
            } catch (error) {
                log(`Failed to set color: ${error.message}`, 'error');
            }
        }

        async function setEnergySaving(level) {
            if (!energyChar) return;

            try {
                const data = new Uint8Array([level]);
                await energyChar.writeValue(data);
                log(`Energy saving set to ${level}`, 'success');
            } catch (error) {
                log(`Failed to set energy saving: ${error.message}`, 'error');
            }
        }

        // Event listeners
        connectBtn.addEventListener('click', () => {
            if (device && device.gatt.connected) {
                disconnect();
            } else {
                connect();
            }
        });

        effectBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setEffect(parseInt(btn.dataset.effect));
            });
        });

        applyColorBtn.addEventListener('click', () => {
            const hex = colorPicker.value.substring(1).toUpperCase();
            setColor(hex);
        });

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const color = btn.dataset.color;
                colorPicker.value = '#' + color;
                setColor(color);
            });
        });

        energySlider.addEventListener('input', () => {
            energyValue.textContent = energySlider.value;
        });

        energySlider.addEventListener('change', () => {
            setEnergySaving(parseInt(energySlider.value));
        });

        // Check Web Bluetooth support
        if (!navigator.bluetooth) {
            log('Web Bluetooth not supported! Use Chrome on desktop or Android.', 'error');
            connectBtn.disabled = true;
            connectBtn.textContent = 'Bluetooth Not Supported';
        }
    </script>
</body>
</html>
